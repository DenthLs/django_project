{% extends "base.html" %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm mt-5">
                <div class="card-header">Придумайте новый пароль</div>
                <div class="card-body">
                    {% if validlink %}
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-success">Сохранить новый пароль</button>
                        </form>
                    {% else %}
                        <div class="alert alert-danger">
                            Ссылка недействительна — возможно, она уже была использована или устарела.
                        </div>
                        <p><a href="{% url 'password_reset' %}">Запросить заново</a></p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
