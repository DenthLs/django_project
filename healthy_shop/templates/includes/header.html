{% load static %}
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'homepage:index_page' %}">
                <img src="{% static 'img/logo.png' %}" alt="" height="50" class="me-2">
                Магазин правильных продуктов
            </a>

            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{% url 'homepage:index_page' %}">Главная</a>
                <a class="nav-link" href="{% url 'homepage:about' %}">О нас</a>
                <a class="nav-link" href="{% url 'homepage:contacts' %}">Контакты</a>
                <a class="nav-link" href="{% url 'catalog:product_list' %}">Каталог</a>
            </div>

            <div class="navbar-nav align-items-center">
                <span class="navbar-text me-3">Пользователь: {{ user }}</span>

                {% if not user.is_authenticated %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Войти в аккаунт</a>
                    <a href="{% url 'register' %}" class="btn btn-light btn-sm">Регистрация</a>
                {% else %}
                    <a href="{% url 'password_change' %}" class="btn btn-outline-light btn-sm me-2">Сменить пароль</a>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Выйти с аккаунта</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
